[package]
name = "duckfn_quantstats"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
# 目前无法按 target 覆盖 crate-type：src/wasm_lib.rs 转发到 src/lib.rs，
# 这样原生编译保持 cdylib，Wasm 编译则用 staticlib（真正的链接由 emcc 完成）。
#
# crate-type can't be (at the moment) be overriden for specific targets:
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc).
name = "duckfn_quantstats"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
# 0.0.8 起提供本扩展用到的全部设施：
#   - `DuckLazySlot<T>`：把 DuckLazy 参数「解析一次」这条路径固化成类型；
#   - `duckdb-1-5` feature 下的 `duckfn::duck_vfs`：宿主文件系统访问 + 一行式读写。其中的
#     `write_string` 就是「覆盖写」（内部处理了「C API 没有 truncate」，旧文件更长也照样写对），
#     所以 `output` 落盘用它，而不是 std::fs —— wasm 上根本没有可写的 std::fs；
#   - `chrono` feature：时间包装类型与 chrono 的双向转换（`DuckDate::to_naive_date`、`from_naive_date`
#     等），越界（含 `DATE 'infinity'`）返回错误而不是 panic，单位换算由方法负责；
#   - 属性宏生成的 `SQL_NAME` 常量：注册进 DuckDB 时真正的函数名（单签名时就是 Rust 函数名）。
#     错误信息前缀因此不必手写第二份字面量，而是从 `kind.rs` 指过去。
#
# Since 0.0.8 duckfn provides everything this project uses:
#   - `DuckLazySlot<T>`, which turns "parse the DuckLazy argument once" into a type;
#   - `duckfn::duck_vfs` under the `duckdb-1-5` feature: host file system access plus one-line reads
#     and writes. Its `write_string` *is* "replace" (a longer existing file is dealt with internally,
#     despite the C API having no truncate), which is what `output` uses instead of `std::fs` — there
#     is no writable `std::fs` on wasm at all;
#   - the `chrono` feature: bidirectional conversions between the time wrapper types and chrono
#     (`DuckDate::to_naive_date`, `from_naive_date`, …), where out-of-range values (including
#     `DATE 'infinity'`) are errors rather than panics and the unit conversion is the method's job;
#   - the `SQL_NAME` constant each attribute macro generates: the name the function is really
#     registered under (the Rust function name, since each name carries one signature). Error prefixes
#     therefore read that constant — `kind.rs` points at it — instead of repeating the literal.
duckfn = { version = "0.0.8", features = ["duckdb-1-5", "chrono"] }

# duckfn 本身就建立在下面两个 crate 之上；需要直接使用它们的类型或 builder 时显式加上。
# quack-rs：duckfn_entrypoint! 展开出的代码直接引用 `quack_rs::` 路径，必须显式依赖。
#
# duckfn is built on the two crates below; add them explicitly when you use their
# types or builders directly.
# quack-rs: the code expanded by `duckfn_entrypoint!` refers to `quack_rs::` paths,
# so it must be a direct dependency.
quack-rs = "0.16.0"

# loadable-extension：走 DuckDB 的 API 函数表分发，而不是链接 libduckdb，
# 这也是「无需在本地编译 DuckDB」的原因（仅使用头文件，不链接库）。
#
# 版本下限是 DuckDB 1.5：客户端上下文 / 宿主文件系统（`duckfn::duck_vfs`）是 1.5 才进 C API 的，
# 本扩展的 `output` 落盘依赖它，所以不再保留 1.4 兼容性。libduckdb-sys 把 DuckDB 版本编码成
# `1.<major*10000 + minor*100 + patch>.0`（1.5.0 → 1.10500.0，1.5.5 → 1.10505.0），
# 于是 `>=1.10500` 就是「DuckDB >= 1.5」，并且排除掉 1.10404.0（= 1.4.4）。
#
# `loadable-extension` dispatches through DuckDB's API table instead of linking
# libduckdb — that is what keeps a local DuckDB build unnecessary (headers only).
#
# The lower bound is DuckDB 1.5: the client context / host file system
# (`duckfn::duck_vfs`) only reached the C API in 1.5, and this extension's `output` depends on
# it, so 1.4 compatibility is gone. libduckdb-sys encodes a DuckDB version as
# `1.<major*10000 + minor*100 + patch>.0` (1.5.0 → 1.10500.0, 1.5.5 → 1.10505.0), so `>=1.10500`
# means "DuckDB >= 1.5" and rules out 1.10404.0 (= 1.4.4).
libduckdb-sys = { version = ">=1.10500, <2", features = ["loadable-extension"] }
quantstats-rs = "0.1.0"

# chrono：本扩展自己用到的是**本地时间**（`chrono::Local`，`open_in_browser` 的临时文件名前缀要用
# 年月日时分秒，见 browser.rs）—— 那是 `clock` feature 里的东西，用默认 feature 即可，不做收窄；
# 日期那头则由 duckfn 的 `chrono` feature 负责换算（`DuckDate::to_naive_date`），它产出的正是
# quantstats-rs 的 `ReturnSeries` 要的 `chrono::NaiveDate`。
#
# 三个 crate 共用同一个 chrono：duckfn 的 `chrono` feature、这里、以及 quantstats-rs 都指向 0.4，
# 所以桥接出来的类型能直接喂给 `ReturnSeries::new`，不会出现第二份 chrono。
#
# chrono: what this extension uses directly is **local time** (`chrono::Local` — the temporary file
# name prefix for `open_in_browser` carries a `%Y%m%d-%H%M%S` stamp, see browser.rs); the date side is
# duckfn's `chrono` feature (`DuckDate::to_naive_date`), which produces exactly the
# `chrono::NaiveDate` quantstats-rs' `ReturnSeries` wants.
#
# All three share one chrono: duckfn's `chrono` feature, this dependency and quantstats-rs all point
# at 0.4, so what the bridge returns can go straight into `ReturnSeries::new` — no second chrono.
chrono = "0.4"

# sanitize-filename：报告文件名里那几段的**合法性**（非法字符、控制字符、Windows 保留设备名、结尾的点与
# 空格）按 Node 同名库的规则由它维护，我们只说「替换成什么」。落盘的 `output_dir` 与浏览器的临时文件都要
# 用（见 naming.rs），所以它是共享依赖 —— wasm 上落盘同样要拼文件名。
#
# sanitize-filename: the **legality** of the parts of a report file name (illegal and control characters,
# Windows reserved device names, trailing dots and spaces) is maintained by this crate, following the rules of
# the Node library of the same name; all we say is what to substitute. Both `output_dir` persistence and the
# browser's temporary file need it (see naming.rs), hence a shared dependency — a wasm build names its report
# files too.
sanitize-filename = "0.6"

# fastrand：报告文件名的随机尾缀（`<时间>-<策略名>-<基准名>-<随机尾缀>.html`）。不自己拼随机数 —— 它正是
# tempfile 内部用的那个随机源，已经在依赖树里，显式依赖不增加任何编译成本。
#
# fastrand: the random suffix of a report file name (`<time>-<strategy>-<benchmark>-<random>.html`). No
# hand-rolled randomness — this is the very random source tempfile uses internally, so it is already in the
# dependency tree and a direct dependency adds no compilation cost at all.
fastrand = "2.5"

# 下面两个只服务配置里的 `open_in_browser`（用系统默认浏览器打开报告），各管一段：
#
#   Browser::temporary_file 用 tempfile 建临时文件，Browser::open_report 用 open 把浏览器叫起来。
#
# 它们被限定在**非 wasm 目标**上，一半是取舍、一半是硬约束：wasm 构建里没有浏览器进程可以启动（那里报告
# 字符串原样返回宿主、这条功能整个被忽略），而 `open` 在 emscripten 上根本编不过（它没有那个平台的实现）。
# 于是 wasm 下这两个 crate 连编都不用编 —— 平台相关的取舍集中在一处，而不是散落成 `#[cfg]`。
#
# The two crates below only serve the `open_in_browser` option (opening the report in the system default
# browser), one part each: `Browser::temporary_file` uses tempfile for the temporary file, while
# `Browser::open_report` uses open to start the browser.
#
# They are limited to **non-wasm targets**, part preference and part hard constraint: a wasm build has no
# browser process to launch (the report string goes back to the host as it is and the whole feature is ignored
# there), and `open` does not even compile for emscripten (it has no implementation for that platform). So on
# wasm these crates are not compiled at all — the platform trade-off lives in one place instead of being
# scattered across `#[cfg]`s.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# open：用系统配置的默认程序打开路径或 URL。各平台入口（Windows 的 ShellExecute、macOS 的 `open`、
# 类 Unix 的 `xdg-open` 及其后备序列）、参数引用、以及不给进程留僵尸子进程都由它负责，不必自己拼命令行。
#
# `shellexecute-on-windows` 让 Windows 上直接走 ShellExecute（原生 API，一次调用），而不是它默认的
# 「起一个 PowerShell 辅助进程、失败再退到 explorer.exe」。前面那个 `insecure` 特性（换成 `cmd /c start`）
# 恰恰是我们要躲开的老路子。
#
# open: opens a path or URL with the program configured on the system. It owns the per-platform entry points
# (ShellExecute on Windows, `open` on macOS, `xdg-open` and its fallbacks on Unix), the argument quoting, and
# not leaving zombie children behind — no hand-built command line.
#
# `shellexecute-on-windows` makes Windows go straight through ShellExecute (one native API call) instead of
# its default "start a PowerShell helper, fall back to explorer.exe". The `insecure` feature (which switches
# to `cmd /c start`) is exactly the old path we want to avoid.
open = { version = "5.4", features = ["shellexecute-on-windows"] }
# tempfile：给出「有意义的前缀 + 随机尾缀」的临时文件名，并保证那个文件是新建的（不会覆盖已有文件）。
# 临时目录、随机尾缀与撞名重试都不必自己写。
#
# tempfile: produces a temporary file name with a meaningful prefix and a random suffix, and guarantees that
# file is newly created (nothing existing is overwritten). The temp directory, the random suffix and the retry
# on collisions are all its job.
tempfile = "3.27"
