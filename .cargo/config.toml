# Windows 上静态链接 C 运行库比较省事。
#
# statically linking the C runtime on windows seems sensible?
[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]

# 编 wasm 时 cdylib 必须按 **side module** 链接，否则 emcc 按独立模块链接、去找一个并不存在的 main。
#
# 编译 wasm 时 cargo 会把**依赖** duckfn 的 lib 目标按它自己清单里声明的三种 crate-type
# （rlib + cdylib + staticlib）全编一遍；这条路径下 rustc 没有给 emcc 传 `-sSIDE_MODULE=2`，
# emcc 于是按独立模块链接，报：
#   wasm-ld: error: libstandalonewasm.a(__main_void.o): undefined symbol: main
# 显式钉住 side module 即可；静态库（真正喂给 emcc 拼扩展的那个产物）不受影响。
#
# Building for wasm, a `cdylib` has to be linked as a **side module**: cargo also builds the
# `cdylib` of the **duckfn dependency** (whose manifest declares rlib + cdylib + staticlib), and in
# that path rustc does not pass `-sSIDE_MODULE=2`, so emcc links it standalone and demands a `main`
# that does not exist. Pinning side-module mode fixes it; the staticlib — the artifact that is
# actually linked into the extension — is untouched.
[target.wasm32-unknown-emscripten]
rustflags = ["-C", "link-arg=-sSIDE_MODULE=2"]
