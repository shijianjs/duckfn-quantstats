# Dependabot：三个生态各开一条 PR，由 CI 验。
#
# 这里**没有** gitsubmodule（extension-ci-tools）：子模块跟的是上游 duckdb/extension-ci-tools 的 main
# 分支，而 MainDistributionPipeline.yml 用的是 v1.5-variegata / v2.0-cyanoptera 这两个 tag 的复用工作流，
# 两者本来就不同步；自动跟上 main 只会让根 Makefile include 进来的 makefile 与工作流声明的
# ci_tools_version 悄悄错位。换 DuckDB 版本是人做的事，不由机器人提议。
#
# Dependabot: three ecosystems, one pull request each, all validated by CI.
#
# gitsubmodule is deliberately absent: extension-ci-tools tracks upstream's main branch while
# MainDistributionPipeline.yml pins the reusable workflow to the v1.5-variegata / v2.0-cyanoptera tags,
# so an automatic bump would desync the makefiles the root Makefile includes from the ci_tools_version
# the workflow declares. Moving to a new DuckDB release stays a manual step.
version: 2
updates:
  # Rust：本仓库只有一份 Cargo.lock，所以 `/` 一处就覆盖 workspace 里所有成员。
  #
  # Rust: the repository has a single Cargo.lock, so "/" covers every workspace member.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # DuckDB 绑定层单独成组：quack-rs 与 libduckdb-sys 的版本号直接编码引擎版本
      # （libduckdb-sys 1.10506.0 = DuckDB 1.5.6 的头文件），而 CI 的 duckdb_version 钉的是 v1.5.6 ——
      # 只升依赖不升引擎，测试引擎与产物就会版本不符而挂。这条 PR 必须人工核对引擎版本一起动。
      #
      # quack-rs as its own group: it (and libduckdb-sys) encodes the engine version in its own version
      # (libduckdb-sys 1.10506.0 = DuckDB 1.5.6 headers) while CI pins duckdb_version to v1.5.6, so
      # bumping the binding without the engine makes the test engine and the artefact disagree.
      duckdb:
        patterns:
          - quack-rs
          - libduckdb-sys
      # 其余依赖只在 minor + patch 上成组：大版本升级各开一条 PR，免得多处破坏性变更堆在一起。
      #
      # Everything else, grouped for minor and patch only; majors stay individual so breaking changes
      # do not arrive bundled in one review.
      rust:
        patterns:
          - "*"
        exclude-patterns:
          - quack-rs
          - libduckdb-sys
        update-types:
          - minor
          - patch

  # npm：文档站自己是 `docs/package.json` + `docs/package-lock.json`（不是 npm workspace），所以
  # directory 指到 docs/。
  #
  # npm: the docs site is `docs/package.json` plus `docs/package-lock.json` (not an npm workspace), so
  # the directory points at docs/.
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # docusaurus 那批包在清单里是精确版本、必须同进同退，所以单独成组并排在最前 —— 一个依赖归入它
      # 匹配到的第一组。
      #
      # The Docusaurus packages are pinned exactly and have to move together; listed first because a
      # dependency joins the first group it matches.
      docusaurus:
        patterns:
          - "@docusaurus/*"
      # 其余 JS 依赖同样只看 minor + patch。
      #
      # The rest, minor and patch only.
      js:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 只挡大版本：文档站要停在 6.x —— Docusaurus 3.10 还不支持 TS 7（duckfn 仓库实测提上去
      # 不行）。6.x 的补丁 / 次版本照常提。
      #
      # TypeScript: majors only. The docs site has to stay on 6.x because Docusaurus 3.10 does not
      # support TS 7 yet; 6.x patch and minor updates still arrive.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions：工作流里的 action 全部按完整 SHA pin、行尾注释写着版本，Dependabot 会把 SHA 与
  # 注释一起更新。合成一条 PR 就够看。
  #
  # GitHub Actions: every action is SHA-pinned with a version comment on the same line, and Dependabot
  # updates both.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
